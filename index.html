<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <title>YT CrossMix: Mezclador de Playlists YouTube con Crossfade</title> 
    
    <meta name="description" content="Crea mezclas perfectas de tus playlists de YouTube. Disfruta de transiciones suaves con crossfade automático entre canciones.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Fuentes de YouTube Music -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    
    <style>
        /* YouTube Music Color Scheme */
        :root {
            /* Dark Theme Colors */
            --yt-spec-base-background: #0f0f0f;
            --yt-spec-raised-background: #212121;
            --yt-spec-menu-background: #282828;
            --yt-spec-inverted-background: #f1f1f1;
            
            /* Text Colors */
            --yt-spec-text-primary: #f1f1f1;
            --yt-spec-text-secondary: #aaaaaa;
            --yt-spec-text-disabled: #717171;
            
            /* Brand Colors */
            --yt-spec-call-to-action: #ff0000;
            --yt-spec-brand-background-solid: #ff0000;
            --yt-spec-brand-background-primary: #ff0000;
            
            /* Interactive Colors */
            --yt-spec-outline: #303030;
            --yt-spec-touch-response: rgba(255, 255, 255, 0.1);
            --yt-spec-icon-active-other: #ff0000;
            
            /* Layout */
            --ytmusic-nav-bar-height: 64px;
            --ytmusic-player-bar-height: 72px;
            --ytmusic-sidebar-width: 240px;
            --ytmusic-sidebar-mini-width: 72px;
            
            /* Spacing */
            --ytmusic-spacing-xs: 4px;
            --ytmusic-spacing-sm: 8px;
            --ytmusic-spacing-md: 16px;
            --ytmusic-spacing-lg: 24px;
            --ytmusic-spacing-xl: 32px;
            
            /* Border Radius */
            --ytmusic-border-radius: 4px;
            --ytmusic-border-radius-lg: 8px;
            --ytmusic-border-radius-xl: 12px;
            
            /* Transitions */
            --ytmusic-transition-timing: 0.2s cubic-bezier(0.05, 0, 0, 1);
        }

        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--yt-spec-base-background);
            color: var(--yt-spec-text-primary);
            overflow: hidden;
            height: 100vh;
            line-height: 1.4;
        }

        /* Main Layout */
        .ytmusic-app {
            display: flex;
            height: 100vh;
            background-color: var(--yt-spec-base-background);
        }

        /* Sidebar */
        .ytmusic-sidebar {
            width: var(--ytmusic-sidebar-width);
            background-color: var(--yt-spec-base-background);
            border-right: 1px solid var(--yt-spec-outline);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: width var(--ytmusic-transition-timing);
        }

        .ytmusic-sidebar.mini {
            width: var(--ytmusic-sidebar-mini-width);
        }

        .ytmusic-sidebar-header {
            padding: var(--ytmusic-spacing-md);
            display: flex;
            align-items: center;
            height: var(--ytmusic-nav-bar-height);
            border-bottom: 1px solid var(--yt-spec-outline);
        }

        .ytmusic-menu-button {
            background: none;
            border: none;
            color: var(--yt-spec-text-primary);
            font-size: 20px;
            padding: var(--ytmusic-spacing-sm);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color var(--ytmusic-transition-timing);
            margin-right: var(--ytmusic-spacing-md);
        }

        .ytmusic-menu-button:hover {
            background-color: var(--yt-spec-touch-response);
        }

        .ytmusic-logo {
            display: flex;
            align-items: center;
            gap: var(--ytmusic-spacing-sm);
        }

        .ytmusic-logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .ytmusic-logo-text {
            font-size: 20px;
            font-weight: 400;
            color: var(--yt-spec-text-primary);
        }

        .ytmusic-nav {
            flex: 1;
            overflow-y: auto;
            padding: var(--ytmusic-spacing-sm) 0;
        }

        .ytmusic-nav-section {
            margin-bottom: var(--ytmusic-spacing-lg);
        }

        .ytmusic-nav-item {
            display: flex;
            align-items: center;
            padding: var(--ytmusic-spacing-sm) var(--ytmusic-spacing-md);
            color: var(--yt-spec-text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all var(--ytmusic-transition-timing);
            border-radius: 0;
        }

        .ytmusic-nav-item:hover {
            background-color: var(--yt-spec-touch-response);
            color: var(--yt-spec-text-primary);
        }

        .ytmusic-nav-item.active {
            background-color: var(--yt-spec-touch-response);
            color: var(--yt-spec-text-primary);
            font-weight: 500;
        }

        .ytmusic-nav-item .material-icons {
            margin-right: var(--ytmusic-spacing-md);
            font-size: 24px;
        }

        /* Main Content */
        .ytmusic-main {
            flex: 1;
            margin-left: var(--ytmusic-sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: margin-left var(--ytmusic-transition-timing);
        }

        .ytmusic-main.sidebar-mini {
            margin-left: var(--ytmusic-sidebar-mini-width);
        }

        /* Top Bar */
        .ytmusic-header {
            height: var(--ytmusic-nav-bar-height);
            background-color: var(--yt-spec-base-background);
            border-bottom: 1px solid var(--yt-spec-outline);
            display: flex;
            align-items: center;
            padding: 0 var(--ytmusic-spacing-lg);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .ytmusic-search-container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .ytmusic-search-form {
            display: flex;
            align-items: center;
            background-color: var(--yt-spec-raised-background);
            border: 1px solid var(--yt-spec-outline);
            border-radius: var(--ytmusic-border-radius-xl);
            overflow: hidden;
        }

        .ytmusic-search-input {
            flex: 1;
            background: none;
            border: none;
            padding: 12px var(--ytmusic-spacing-md);
            color: var(--yt-spec-text-primary);
            font-size: 16px;
            outline: none;
        }

        .ytmusic-search-input::placeholder {
            color: var(--yt-spec-text-disabled);
        }

        .ytmusic-search-button {
            background: none;
            border: none;
            color: var(--yt-spec-text-secondary);
            padding: 12px var(--ytmusic-spacing-md);
            cursor: pointer;
            transition: color var(--ytmusic-transition-timing);
        }

        .ytmusic-search-button:hover {
            color: var(--yt-spec-text-primary);
        }

        .ytmusic-user-menu {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: var(--ytmusic-spacing-sm);
        }

        .ytmusic-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        /* Content Area */
        .ytmusic-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: var(--ytmusic-player-bar-height);
        }

        .ytmusic-page {
            display: none;
            min-height: calc(100vh - var(--ytmusic-nav-bar-height) - var(--ytmusic-player-bar-height));
        }

        .ytmusic-page.active {
            display: block;
        }

        .ytmusic-page-header {
            padding: var(--ytmusic-spacing-xl) var(--ytmusic-spacing-lg) var(--ytmusic-spacing-lg);
        }

        .ytmusic-page-title {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: var(--ytmusic-spacing-sm);
            color: var(--yt-spec-text-primary);
        }

        .ytmusic-page-subtitle {
            font-size: 14px;
            color: var(--yt-spec-text-secondary);
        }

        /* Cards Grid */
        .ytmusic-shelf {
            margin-bottom: var(--ytmusic-spacing-xl);
            padding: 0 var(--ytmusic-spacing-lg);
        }

        .ytmusic-shelf-header {
            margin-bottom: var(--ytmusic-spacing-md);
        }

        .ytmusic-shelf-title {
            font-size: 22px;
            font-weight: 400;
            color: var(--yt-spec-text-primary);
        }

        .ytmusic-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--ytmusic-spacing-md);
        }

        .ytmusic-card {
            background-color: var(--yt-spec-raised-background);
            border-radius: var(--ytmusic-border-radius);
            padding: var(--ytmusic-spacing-md);
            cursor: pointer;
            transition: all var(--ytmusic-transition-timing);
            border: 1px solid transparent;
        }

        .ytmusic-card:hover {
            background-color: var(--yt-spec-menu-background);
            border-color: var(--yt-spec-outline);
        }

        .ytmusic-card-thumbnail {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--ytmusic-border-radius);
            overflow: hidden;
            margin-bottom: var(--ytmusic-spacing-sm);
            position: relative;
        }

        .ytmusic-card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ytmusic-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--ytmusic-transition-timing);
        }

        .ytmusic-card:hover .ytmusic-play-overlay {
            opacity: 1;
        }

        .ytmusic-play-button {
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 20px;
            cursor: pointer;
        }

        .ytmusic-card-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--yt-spec-text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ytmusic-card-subtitle {
            font-size: 12px;
            color: var(--yt-spec-text-secondary);
            line-height: 1.3;
        }

        /* Search Results */
        .ytmusic-search-results {
            padding: var(--ytmusic-spacing-lg);
        }

        .ytmusic-track-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .ytmusic-track-item {
            display: flex;
            align-items: center;
            padding: var(--ytmusic-spacing-sm) var(--ytmusic-spacing-md);
            border-radius: var(--ytmusic-border-radius);
            cursor: pointer;
            transition: background-color var(--ytmusic-transition-timing);
        }

        .ytmusic-track-item:hover {
            background-color: var(--yt-spec-touch-response);
        }

        .ytmusic-track-thumbnail {
            width: 48px;
            height: 48px;
            border-radius: var(--ytmusic-border-radius);
            margin-right: var(--ytmusic-spacing-md);
            object-fit: cover;
        }

        .ytmusic-track-info {
            flex: 1;
            min-width: 0;
        }

        .ytmusic-track-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--yt-spec-text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ytmusic-track-subtitle {
            font-size: 12px;
            color: var(--yt-spec-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ytmusic-track-duration {
            color: var(--yt-spec-text-secondary);
            font-size: 12px;
            margin-right: var(--ytmusic-spacing-md);
        }

        .ytmusic-track-menu {
            background: none;
            border: none;
            color: var(--yt-spec-text-secondary);
            padding: var(--ytmusic-spacing-xs);
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: all var(--ytmusic-transition-timing);
        }

        .ytmusic-track-item:hover .ytmusic-track-menu {
            opacity: 1;
        }

        .ytmusic-track-menu:hover {
            background-color: var(--yt-spec-touch-response);
            color: var(--yt-spec-text-primary);
        }

        /* Player Bar */
        .ytmusic-player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--ytmusic-player-bar-height);
            background-color: var(--yt-spec-raised-background);
            border-top: 1px solid var(--yt-spec-outline);
            display: flex;
            align-items: center;
            padding: 0 var(--ytmusic-spacing-md);
            z-index: 200;
        }

        .ytmusic-player-info {
            display: flex;
            align-items: center;
            min-width: 0;
            flex: 1;
            max-width: 300px;
        }

        .ytmusic-player-thumbnail {
            width: 56px;
            height: 56px;
            border-radius: var(--ytmusic-border-radius);
            margin-right: var(--ytmusic-spacing-md);
            object-fit: cover;
            cursor: pointer;
        }

        .ytmusic-player-details {
            min-width: 0;
            flex: 1;
        }

        .ytmusic-player-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--yt-spec-text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .ytmusic-player-artist {
            font-size: 12px;
            color: var(--yt-spec-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .ytmusic-player-controls {
            display: flex;
            align-items: center;
            gap: var(--ytmusic-spacing-md);
            flex: 1;
            justify-content: center;
            max-width: 600px;
        }

        .ytmusic-control-button {
            background: none;
            border: none;
            color: var(--yt-spec-text-primary);
            cursor: pointer;
            padding: var(--ytmusic-spacing-xs);
            border-radius: 50%;
            transition: all var(--ytmusic-transition-timing);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ytmusic-control-button:hover {
            background-color: var(--yt-spec-touch-response);
        }

        .ytmusic-control-button.primary {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }

        .ytmusic-control-button.secondary {
            width: 32px;
            height: 32px;
            font-size: 16px;
        }

        .ytmusic-player-extras {
            display: flex;
            align-items: center;
            gap: var(--ytmusic-spacing-sm);
            flex: 1;
            justify-content: flex-end;
            max-width: 300px;
        }

        .ytmusic-volume-container {
            display: flex;
            align-items: center;
            gap: var(--ytmusic-spacing-sm);
        }

        .ytmusic-volume-slider {
            width: 80px;
            height: 4px;
            background-color: var(--yt-spec-outline);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .ytmusic-volume-slider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 60%;
            height: 100%;
            background-color: var(--yt-spec-text-primary);
            border-radius: 2px;
        }

        /* Video Container */
        .ytmusic-video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            margin: var(--ytmusic-spacing-xl) auto;
            background-color: #000;
            border-radius: var(--ytmusic-border-radius-lg);
            overflow: hidden;
        }

        .ytmusic-video-player {
            width: 100%;
            height: 100%;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .ytmusic-sidebar {
                transform: translateX(-100%);
            }
            
            .ytmusic-sidebar.open {
                transform: translateX(0);
            }
            
            .ytmusic-main {
                margin-left: 0;
            }
            
            .ytmusic-cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .ytmusic-player-bar {
                flex-direction: column;
                height: auto;
                padding: var(--ytmusic-spacing-sm);
            }
            
            .ytmusic-player-info,
            .ytmusic-player-controls,
            .ytmusic-player-extras {
                max-width: none;
                width: 100%;
            }
            
            .ytmusic-player-controls {
                order: -1;
                margin-bottom: var(--ytmusic-spacing-sm);
            }
            
            .ytmusic-cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--yt-spec-base-background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--yt-spec-outline);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--yt-spec-text-disabled);
        }

        /* Loading States */
        .ytmusic-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--ytmusic-spacing-xl);
        }

        .ytmusic-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--yt-spec-outline);
            border-top: 3px solid var(--yt-spec-brand-background-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty States */
        .ytmusic-empty-state {
            text-align: center;
            padding: var(--ytmusic-spacing-xl);
            color: var(--yt-spec-text-secondary);
        }

        .ytmusic-empty-state .material-icons {
            font-size: 48px;
            margin-bottom: var(--ytmusic-spacing-md);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="ytmusic-app">
        <!-- Sidebar -->
        <nav class="ytmusic-sidebar" id="sidebar">
            <div class="ytmusic-sidebar-header">
                <button class="ytmusic-menu-button" id="menuToggle">
                    <span class="material-icons">menu</span>
                </button>
                <div class="ytmusic-logo">
                    <div class="ytmusic-logo-icon">
                        <span class="material-icons">music_note</span>
                    </div>
                    <span class="ytmusic-logo-text">CrossMix</span>
                </div>
            </div>

            <div class="ytmusic-nav">
                <div class="ytmusic-nav-section">
                    <a href="#" class="ytmusic-nav-item active" data-page="home">
                        <span class="material-icons">home</span>
                        <span>Inicio</span>
                    </a>
                    <a href="#" class="ytmusic-nav-item" data-page="search">
                        <span class="material-icons">search</span>
                        <span>Explorar</span>
                    </a>
                    <a href="#" class="ytmusic-nav-item" data-page="library">
                        <span class="material-icons">library_music</span>
                        <span>Biblioteca</span>
                    </a>
                    <a href="#" class="ytmusic-nav-item" data-page="playing">
                        <span class="material-icons">play_circle</span>
                        <span>Reproduciendo</span>
                    </a>
                </div>

                <div class="ytmusic-nav-section">
                    <a href="#" class="ytmusic-nav-item">
                        <span class="material-icons">queue_music</span>
                        <span>Cola</span>
                    </a>
                    <a href="#" class="ytmusic-nav-item">
                        <span class="material-icons">history</span>
                        <span>Historial</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="ytmusic-main" id="mainContent">
            <!-- Header -->
            <header class="ytmusic-header">
                <div class="ytmusic-search-container">
                    <form class="ytmusic-search-form">
                        <input 
                            type="text" 
                            class="ytmusic-search-input"
                            id="searchInput"
                            placeholder="Buscar canciones, artistas, playlists..."
                        >
                        <button type="button" class="ytmusic-search-button">
                            <span class="material-icons">search</span>
                        </button>
                    </form>
                </div>

                <div class="ytmusic-user-menu">
                    <button class="ytmusic-control-button">
                        <span class="material-icons">settings</span>
                    </button>
                    <button class="ytmusic-avatar" id="userAvatar">
                        <span class="material-icons">person</span>
                    </button>
                </div>
            </header>

            <!-- Content Pages -->
            <div class="ytmusic-content">
                <!-- Home Page -->
                <div class="ytmusic-page active" id="homePage">
                    <div class="ytmusic-page-header">
                        <h1 class="ytmusic-page-title">Inicio</h1>
                        <p class="ytmusic-page-subtitle">Tu música, tus mezclas perfectas</p>
                    </div>

                    <div class="ytmusic-shelf">
                        <div class="ytmusic-shelf-header">
                            <h2 class="ytmusic-shelf-title">Playlists recientes</h2>
                        </div>
                        <div class="ytmusic-cards-grid" id="libraryGrid">
                            <!-- Library content will be populated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Playing Page -->
                <div class="ytmusic-page" id="playingPage">
                    <div class="ytmusic-page-header">
                        <h1 class="ytmusic-page-title">Reproduciendo ahora</h1>
                    </div>

                    <div style="padding: 0 var(--ytmusic-spacing-lg);">
                        <div class="ytmusic-video-container" id="videoContainer">
                            <div id="player1" class="ytmusic-video-player"></div>
                            <div id="player2" class="ytmusic-video-player" style="display: none;"></div>
                        </div>

                        <div class="ytmusic-shelf">
                            <div class="ytmusic-shelf-header">
                                <h2 class="ytmusic-shelf-title">Cola de reproducción</h2>
                            </div>
                            <div class="ytmusic-track-list" id="queueList">
                                <!-- Queue will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Bar -->
        <div class="ytmusic-player-bar">
            <div class="ytmusic-player-info">
                <img 
                    src="https://via.placeholder.com/56x56?text=♪" 
                    alt="Now playing" 
                    class="ytmusic-player-thumbnail"
                    id="playerThumbnail"
                >
                <div class="ytmusic-player-details">
                    <div class="ytmusic-player-title" id="playerTitle">
                        Selecciona una canción
                    </div>
                    <div class="ytmusic-player-artist" id="playerArtist">
                        YT CrossMix
                    </div>
                </div>
            </div>

            <div class="ytmusic-player-controls">
                <button class="ytmusic-control-button secondary">
                    <span class="material-icons">shuffle</span>
                </button>
                <button class="ytmusic-control-button secondary">
                    <span class="material-icons">skip_previous</span>
                </button>
                <button class="ytmusic-control-button primary" id="playPauseBtn">
                    <span class="material-icons">play_arrow</span>
                </button>
                <button class="ytmusic-control-button secondary" id="nextBtn">
                    <span class="material-icons">skip_next</span>
                </button>
                <button class="ytmusic-control-button secondary">
                    <span class="material-icons">repeat</span>
                </button>
            </div>

            <div class="ytmusic-player-extras">
                <button class="ytmusic-control-button secondary">
                    <span class="material-icons">queue_music</span>
                </button>
                <div class="ytmusic-volume-container">
                    <button class="ytmusic-control-button secondary">
                        <span class="material-icons">volume_up</span>
                    </button>
                    <div class="ytmusic-volume-slider"></div>
                </div>
                <button class="ytmusic-control-button secondary">
                    <span class="material-icons">fullscreen</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Elements for Compatibility -->
    <div style="display: none;">
        <button id="botonPlay"></button>
        <button id="botonNext"></button>
        <input id="searchInput2" type="text">
        <button id="añadirUrlButton"></button>
        <div id="playlistContainer"></div>
        <div id="results"></div>
        <div id="floatingMessageContainer"></div>
    </div>

    <script type="module">
        // YouTube Music UI Controller
        class YouTubeMusicController {
            constructor() {
                this.currentPage = 'home';
                this.sidebarCollapsed = false;
                this.isPlaying = false;
                this.currentTrack = null;
                this.queue.push(
    { videoId: 'e2XmY-s-oE8', title: 'The Less I Know The Better', artist: 'Tame Impala', thumbnail: 'https://img.youtube.com/vi/e2XmY-s-oE8/hqdefault.jpg', duration: '3:30' },
    { videoId: 'e-ORhEE9', title: 'Lost In The Fire', artist: 'The Weeknd & Gesaffelstein', thumbnail: 'https://img.youtube.com/vi/e-ORhEE9T_A/hqdefault.jpg', duration: '3:30' },
    { videoId: 'P_j64_Y352k', title: 'Bad Guy', artist: 'Billie Eilish', thumbnail: 'https://img.youtube.com/vi/P_j64_Y352k/hqdefault.jpg', duration: '3:15' }
);
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupSearch();
                this.loadSampleData();
                this.integrateWithExistingApp();
            }

            switchPage(pageId) {
                // Update navigation
                document.querySelectorAll('.ytmusic-nav-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                const activeNavItem = document.querySelector(`[data-page="${pageId}"]`);
                if (activeNavItem) {
                    activeNavItem.classList.add('active');
                }

                // Update pages
                document.querySelectorAll('.ytmusic-page').forEach(page => {
                    page.classList.remove('active');
                });

                const targetPage = document.getElementById(`${pageId}Page`);
                if (targetPage) {
                    targetPage.classList.add('active');
                }

                this.currentPage = pageId;
                this.loadPageContent(pageId);

                // Trigger compatibility event
                if (typeof window.switchView === 'function') {
                    window.switchView(pageId);
                }
            }

            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('mainContent');
                
                this.sidebarCollapsed = !this.sidebarCollapsed;
                
                if (this.sidebarCollapsed) {
                    sidebar.classList.add('mini');
                    mainContent.classList.add('sidebar-mini');
                } else {
                    sidebar.classList.remove('mini');
                    mainContent.classList.remove('sidebar-mini');
                }
            }

            togglePlayPause() {
                this.isPlaying = !this.isPlaying;
                const playPauseBtn = document.getElementById('playPauseBtn');
                const icon = playPauseBtn.querySelector('.material-icons');
                
                if (this.isPlaying) {
                    icon.textContent = 'pause';
                } else {
                    icon.textContent = 'play_arrow';
                }

                // Trigger existing play button
                const existingPlayBtn = document.getElementById('botonPlay');
                if (existingPlayBtn) {
                    existingPlayBtn.click();
                }
            }

            nextTrack() {
                // Trigger existing next button
                const existingNextBtn = document.getElementById('botonNext');
                if (existingNextBtn) {
                    existingNextBtn.click();
                }
            }

            handleSearch(query) {
                if (query.length > 2) {
                    this.switchPage('search');
                    this.performSearch(query);
                } else if (query.length === 0) {
                    this.clearSearch();
                }
            }

            async performSearch(query) {
                const resultsContainer = document.getElementById('searchResults');
                
                // Show loading
                resultsContainer.innerHTML = `
                    <div class="ytmusic-loading">
                        <div class="ytmusic-spinner"></div>
                    </div>
                `;

                // Use existing search functionality
                if (window.SearchManager && typeof window.SearchManager.performSearch === 'function') {
                    try {
                        await window.SearchManager.performSearch(query);
                        this.updateSearchResultsUI();
                    } catch (error) {
                        console.error('Search error:', error);
                        this.showSearchError();
                    }
                } else {
                    // Fallback to mock results
                    setTimeout(() => {
                        this.showMockSearchResults(query);
                    }, 1000);
                }
            }

            updateSearchResultsUI() {
                // This will be called to update the YouTube Music style search results
                // Integration with existing search results
                const existingResults = document.querySelector('#results .video-result, #searchResults .video-result');
                if (existingResults) {
                    this.convertSearchResultsToYTMusicStyle();
                }
            }

            convertSearchResultsToYTMusicStyle() {
                const resultsContainer = document.getElementById('searchResults');
                const existingResults = document.querySelectorAll('.video-result');
                
                if (existingResults.length === 0) return;

                const trackList = document.createElement('div');
                trackList.className = 'ytmusic-track-list';

                existingResults.forEach(result => {
                    const title = result.querySelector('.video-title')?.textContent || '';
                    const author = result.querySelector('.video-author')?.textContent || '';
                    const thumbnail = result.querySelector('.thumbnail')?.src || '';
                    const duration = result.querySelector('.duration')?.textContent || '';
                    const videoId = result.dataset.videoId;

                    const trackItem = this.createTrackItem({
                        title,
                        artist: author,
                        thumbnail,
                        duration,
                        videoId
                    });

                    trackList.appendChild(trackItem);
                });

                resultsContainer.innerHTML = '';
                resultsContainer.appendChild(trackList);
            }

            createTrackItem(track) {
                const item = document.createElement('div');
                item.className = 'ytmusic-track-item';
                item.dataset.videoId = track.videoId;

                item.innerHTML = `
                    <img src="${track.thumbnail}" alt="${track.title}" class="ytmusic-track-thumbnail">
                    <div class="ytmusic-track-info">
                        <div class="ytmusic-track-title">${track.title}</div>
                        <div class="ytmusic-track-subtitle">${track.artist}</div>
                    </div>
                    <div class="ytmusic-track-duration">${track.duration}</div>
                    <button class="ytmusic-track-menu">
                        <span class="material-icons">more_vert</span>
                    </button>
                `;

                // Add click handlers
                item.addEventListener('click', () => {
                    this.playTrack(track);
                });

                const menuBtn = item.querySelector('.ytmusic-track-menu');
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.showTrackMenu(track, menuBtn);
                });

                return item;
            }

            playTrack(track) {
                this.currentTrack = track;
                this.updatePlayerInfo(track);
                
                // Add to queue using existing functionality
                if (window.UIManager && window.UIManager.handlePlayNextActionFromSearch) {
                    window.UIManager.handlePlayNextActionFromSearch(track.videoId, track);
                }
                
                this.switchPage('playing');
            }

            updatePlayerInfo(track) {
                const playerTitle = document.getElementById('playerTitle');
                const playerArtist = document.getElementById('playerArtist');
                const playerThumbnail = document.getElementById('playerThumbnail');

                if (playerTitle) playerTitle.textContent = track.title;
                if (playerArtist) playerArtist.textContent = track.artist;
                if (playerThumbnail) playerThumbnail.src = track.thumbnail;
            }

            showTrackMenu(track, anchor) {
                // Create context menu (simplified for this demo)
                console.log('Show menu for:', track.title);
            }

            loadPageContent(pageId) {
                switch (pageId) {
                    case 'home':
                        this.loadHomeContent();
                        break;
                    case 'library':
                        this.loadLibraryContent();
                        break;
                    case 'playing':
                        this.loadPlayingContent();
                        break;
                }
            }

            loadHomeContent() {
                const recentGrid = document.getElementById('recentGrid');
                const playlistsGrid = document.getElementById('playlistsGrid');

                // Load from existing data if available
                if (window.PlaylistState && window.PlaylistState.playlistsData) {
                    this.populatePlaylistsGrid(playlistsGrid, window.PlaylistState.playlistsData);
                } else {
                    this.loadSamplePlaylists(playlistsGrid);
                }
            }

            loadLibraryContent() {
                const libraryGrid = document.getElementById('libraryGrid');
                
                if (window.PlaylistState && window.PlaylistState.playlistsData) {
                    this.populatePlaylistsGrid(libraryGrid, window.PlaylistState.playlistsData);
                } else {
                    libraryGrid.innerHTML = `
                        <div class="ytmusic-empty-state">
                            <span class="material-icons">library_music</span>
                            <p>No hay playlists disponibles</p>
                            <p>Añade algunas playlists para comenzar</p>
                        </div>
                    `;
                }
            }

            loadPlayingContent() {
                const queueList = document.getElementById('queueList');
                
                // Load queue from existing state
                if (window.PlaylistManager) {
                    const flatList = window.PlaylistManager.getFlattenedPlaylist();
                    this.populateQueueList(queueList, flatList);
                }
            }

            populatePlaylistsGrid(container, playlists) {
                container.innerHTML = '';
                
                playlists.forEach(playlist => {
                    const card = this.createPlaylistCard(playlist);
                    container.appendChild(card);
                });
            }

            createPlaylistCard(playlist) {
                const card = document.createElement('div');
                card.className = 'ytmusic-card';
                card.dataset.playlistId = playlist.id;

                card.innerHTML = `
                    <div class="ytmusic-card-thumbnail">
                        <img src="${playlist.thumbnailUrl}" alt="${playlist.name}" class="ytmusic-card-image">
                        <div class="ytmusic-play-overlay">
                            <button class="ytmusic-play-button">
                                <span class="material-icons">play_arrow</span>
                            </button>
                        </div>
                    </div>
                    <div class="ytmusic-card-title">${playlist.name}</div>
                    <div class="ytmusic-card-subtitle">${playlist.videos.length} canciones</div>
                `;

                card.addEventListener('click', () => {
                    this.openPlaylist(playlist);
                });

                return card;
            }

            populateQueueList(container, tracks) {
                container.innerHTML = '';
                
                if (tracks.length === 0) {
                    container.innerHTML = `
                        <div class="ytmusic-empty-state">
                            <span class="material-icons">queue_music</span>
                            <p>La cola está vacía</p>
                            <p>Añade música para comenzar a escuchar</p>
                        </div>
                    `;
                    return;
                }

                tracks.forEach((track, index) => {
                    const trackItem = this.createTrackItem({
                        title: track.title,
                        artist: track.channelTitle || 'Desconocido',
                        thumbnail: track.thumbnail,
                        duration: this.formatDuration(track.duration),
                        videoId: track.videoId
                    });
                    
                    // Highlight current playing track
                    if (window.PlaylistState && 
                        window.PlaylistState.currentPlayingInfo.videoId === track.videoId) {
                        trackItem.style.backgroundColor = 'var(--yt-spec-touch-response)';
                    }
                    
                    container.appendChild(trackItem);
                });
            }

            formatDuration(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
            }

            openPlaylist(playlist) {
                this.switchPage('playing');
                
                // Use existing playlist functionality
                if (window.UIManager && window.UIManager.playEntirePlaylist) {
                    window.UIManager.playEntirePlaylist(playlist);
                }
            }

            showSearchError() {
                const resultsContainer = document.getElementById('searchResults');
                resultsContainer.innerHTML = `
                    <div class="ytmusic-empty-state">
                        <span class="material-icons">error</span>
                        <p>Error al buscar</p>
                        <p>Inténtalo de nuevo</p>
                    </div>
                `;
            }

            showMockSearchResults(query) {
                const resultsContainer = document.getElementById('searchResults');
                const mockResults = [
                    {
                        title: `Resultado de búsqueda para "${query}"`,
                        artist: 'Artista de ejemplo',
                        thumbnail: 'https://via.placeholder.com/48x48?text=♪',
                        duration: '3:45',
                        videoId: 'mock1'
                    },
                    {
                        title: `Otra canción con "${query}"`,
                        artist: 'Otro artista',
                        thumbnail: 'https://via.placeholder.com/48x48?text=♫',
                        duration: '4:20',
                        videoId: 'mock2'
                    }
                ];

                const trackList = document.createElement('div');
                trackList.className = 'ytmusic-track-list';

                mockResults.forEach(track => {
                    const trackItem = this.createTrackItem(track);
                    trackList.appendChild(trackItem);
                });

                resultsContainer.innerHTML = '';
                resultsContainer.appendChild(trackList);
            }

            loadSampleData() {
                // Load sample playlists if no real data is available
                this.loadSamplePlaylists(document.getElementById('playlistsGrid'));
            }

            loadSamplePlaylists(container) {
                const samplePlaylists = [
                    {
                        id: 'sample1',
                        name: 'Mi Mix Favorito',
                        thumbnailUrl: 'https://via.placeholder.com/200x200?text=Mix+1',
                        videos: Array(10).fill({}).map((_, i) => ({ title: `Canción ${i+1}`, duration: 180 }))
                    },
                    {
                        id: 'sample2', 
                        name: 'Éxitos del Rock',
                        thumbnailUrl: 'https://via.placeholder.com/200x200?text=Rock',
                        videos: Array(15).fill({}).map((_, i) => ({ title: `Rock ${i+1}`, duration: 240 }))
                    }
                ];

                this.populatePlaylistsGrid(container, samplePlaylists);
            }

            integrateWithExistingApp() {
                // Wait for existing app to load
                if (window.YTCrossMixApp) {
                    this.connectWithExistingApp();
                } else {
                    // Poll for app availability
                    const checkApp = setInterval(() => {
                        if (window.YTCrossMixApp) {
                            clearInterval(checkApp);
                            this.connectWithExistingApp();
                        }
                    }, 500);
                }

                // Listen for playlist updates
                document.addEventListener('playlistsUpdated', () => {
                    this.loadHomeContent();
                    this.loadLibraryContent();
                });

                // Listen for player state changes
                document.addEventListener('playerStateChanged', (event) => {
                    const { videoId, state } = event.detail;
                    this.updatePlayerState(videoId, state);
                });

                // Create proxy buttons for compatibility
                this.createCompatibilityButtons();
            }

            connectWithExistingApp() {
                console.log('Connected with existing YT CrossMix app');
                
                // Sync initial state
                if (window.PlaylistState) {
                    this.loadHomeContent();
                    this.loadLibraryContent();
                }
            }

            updatePlayerState(videoId, state) {
                // Update UI based on player state changes
                if (state === 'playing') {
                    this.isPlaying = true;
                    const playPauseBtn = document.getElementById('playPauseBtn');
                    if (playPauseBtn) {
                        playPauseBtn.querySelector('.material-icons').textContent = 'pause';
                    }
                } else if (state === 'paused') {
                    this.isPlaying = false;
                    const playPauseBtn = document.getElementById('playPauseBtn');
                    if (playPauseBtn) {
                        playPauseBtn.querySelector('.material-icons').textContent = 'play_arrow';
                    }
                }
            }

            createCompatibilityButtons() {
                // Map new buttons to existing functionality
                const hiddenPlayBtn = document.getElementById('botonPlay');
                const hiddenNextBtn = document.getElementById('botonNext');

                if (hiddenPlayBtn) {
                    // Sync button states
                    const observer = new MutationObserver(() => {
                        const isPlayButton = hiddenPlayBtn.innerHTML.includes('play');
                        const playPauseBtn = document.getElementById('playPauseBtn');
                        if (playPauseBtn) {
                            const icon = playPauseBtn.querySelector('.material-icons');
                            icon.textContent = isPlayButton ? 'play_arrow' : 'pause';
                        }
                    });
                    observer.observe(hiddenPlayBtn, { childList: true });
                }
            }

            setupSearch() {
                // Enhanced search functionality
                let searchTimeout;
                const searchInput = document.getElementById('searchInput');
                
                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        clearTimeout(searchTimeout);
                        const query = e.target.value.trim();
                        
                        searchTimeout = setTimeout(() => {
                            this.handleSearch(query);
                        }, 300);
                    });

                    searchInput.addEventListener('focus', () => {
                        if (this.currentPage !== 'search') {
                            this.switchPage('search');
                        }
                    });
                }
            }

        // Initialize YouTube Music UI
        document.addEventListener('DOMContentLoaded', () => {
            window.ytMusicController = new YouTubeMusicController();
            console.log('YouTube Music UI initialized');
        });

        // Make controller available globally for integration
        window.YouTubeMusicController = YouTubeMusicController;

        // Integration with existing modules
        import('./app.js').catch(() => {
            console.log('Main app.js not found, running in standalone mode');
        });
    </script>
</body>
