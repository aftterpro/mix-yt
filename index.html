<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT CrossMix - Modular</title>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Estilos CSS (aquí irían tus estilos existentes) -->
    <style>
        /* Estilos básicos - reemplaza con tus estilos reales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        button {
            background-color: #ff6b00;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        input {
            padding: 8px;
            border: 1px solid #666;
            border-radius: 3px;
            background-color: #333;
            color: white;
        }
        
        .players-container {
            position: relative;
            width: 100%;
            height: 400px;
            margin-bottom: 20px;
            background-color: #000;
        }
        
        #player1, #player2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
        }
        
        .hidden {
            opacity: 0;
        }
        
        .fade-out {
            opacity: 0;
        }
        
        .fade-in {
            opacity: 1;
        }
        
        #playlistContainer {
            max-height: 400px;
            overflow-y: auto;
            background-color: #2a2a2a;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
        }
        
        .playlist-group {
            margin-bottom: 10px;
        }
        
        .playlist-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background-color: #3a3a3a;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .playlist-group-thumb {
            width: 40px;
            height: 30px;
            object-fit: cover;
            border-radius: 2px;
        }
        
        .playlist-group-name {
            flex: 1;
            font-weight: bold;
        }
        
        .playlist-group-videos {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background-color: #333;
            margin: 2px 0;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .playlist-item.playing {
            background-color: #ff6b0044;
            border-left: 3px solid #ff6b00;
        }
        
        .playlist-item img {
            width: 60px;
            height: 45px;
            object-fit: cover;
        }
        
        .delete-menu {
            position: relative;
        }
        
        .delete-menu-button {
            background: none;
            border: none;
            color: white;
            padding: 5px;
            cursor: pointer;
        }
        
        .delete-menu-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #444;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 1000;
            border-radius: 3px;
        }
        
        .delete-menu-content button {
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        
        .delete-menu-content button:hover {
            background-color: #555;
        }
        
        .search-container {
            margin-bottom: 20px;
        }
        
        #resultsContainer {
            max-height: 400px;
            overflow-y: auto;
            background-color: #2a2a2a;
            border-radius: 5px;
            padding: 10px;
        }
        
        .video-result {
            display: flex;
            gap: 10px;
            padding: 10px;
            background-color: #333;
            margin-bottom: 10px;
            border-radius: 3px;
        }
        
        .video-result img {
            width: 120px;
            height: 90px;
            object-fit: cover;
        }
        
        .video-details {
            flex: 1;
        }
        
        .mensaje-flotante {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #ff6b00;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 10000;
            animation: slideIn 0.3s ease;
        }
        
        .mensaje-flotante.fadeOut {
            animation: slideOut 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>YT CrossMix - Versión Modular</h1>
    
    <!-- Controles principales -->
    <div class="controls">
        <button id="botonPlay" disabled>
            <i class="fas fa-play"></i>
        </button>
        <button id="botonNext">
            <i class="fas fa-forward"></i> Mix
        </button>
        <button onclick="window.YTCrossMixApp.debug()">
            <i class="fas fa-bug"></i> Debug
        </button>
        <button onclick="window.YTCrossMixApp.reset()">
            <i class="fas fa-refresh"></i> Reset
        </button>
    </div>
    
    <!-- Contenedor de reproductores -->
    <div class="players-container">
        <div id="player1"></div>
        <div id="player2" class="hidden"></div>
    </div>
    
    <!-- Búsqueda -->
    <div class="search-container">
        <h3>Buscar Videos</h3>
        <input type="text" id="searchInput" placeholder="Buscar videos...">
        <div id="resultsContainer">
            <div id="results"></div>
        </div>
    </div>
    
    <!-- Añadir playlist por URL -->
    <div class="search-container">
        <h3>Añadir Playlist</h3>
        <div class="controls">
            <input type="text" id="searchInput2" placeholder="URL de playlist de YouTube">
            <button id="añadirUrlButton">
                <i class="fas fa-plus"></i> Añadir
            </button>
        </div>
    </div>
    
    <!-- Contenedor de playlists -->
    <div>
        <h3>Playlists</h3>
        <div id="playlistContainer"></div>
    </div>
    
    <!-- Scripts -->
    <script type="module">
        // Importar y usar los módulos
        import './app.js';
        
        // La aplicación se inicializará automáticamente cuando el DOM esté listo
        console.log('Módulos cargados, la aplicación se está inicializando...');
        
        // Ejemplo de uso de la API modular
        window.addEventListener('load', () => {
            // Acceder a la instancia de la aplicación
            const app = window.YTCrossMixApp;
            
            // Ejemplo: obtener estadísticas cada 10 segundos
            setInterval(() => {
                const stats = app.getStats();
                console.log('Stats:', stats);
            }, 10000);
        });
    </script>
</body>
</html>
