<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Playlist Manager With Crossfire</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="/styles.css">
  <link rel="stylesheet" type="text/css" href="/efecto.css">
  <link rel="stylesheet" type="text/css" href="/botones.css">
  <link rel="icon" href="/electronic.ico">
</head>
<body>
  <header>
    <h3>YT Playlist Manager With Crossfire</h3>
  </header>
  <main>
    <section id="search-panel">
      <h2>Search Videos</h2>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search">
      </div>
      <div id="resultsContainer">
        <div id="results"></div>
      </div>
    </section>

    <section id="player-panel">
      <h2>Reproductor</h2>
       <div class="playlist-url-input"> <input type="text" id="searchInput2" placeholder="Añadir Link Playlist :)"> </div>     
	<button id="añadirUrlButton" class="add-to-playlist">
    <i class="fa-solid fa-plus"></i> <span class="add-text">Añadir a la playlist</span>
	</button>
            <div id="videoContainer">
       <div id="player1" class="video-player"></div>
        <div id="player2" class="video-player hidden"></div>
      </div>
      <div id="controls">
        <button id="mixButton"><i class="fas fa-random"></i> Mix</button>
            <button id="iniciarButton">Iniciar</button>
            </div>
    </section>

   <section id="playlist-panel">
  <div class="panel-header-tabs">
    <h2>Biblioteca</h2>
    <div id="auth-controls">
        <button id="googleSignInButton" onclick="handleAuthClick()" class="auth-btn google-login">
            <i class="fab fa-google"></i> Acceder
        </button>
        <button id="googleSignOutButton" onclick="handleSignOutClick()" class="auth-btn google-logout" style="display:none">
            <i class="fas fa-sign-out-alt"></i> Salir
        </button>
    </div>
  </div>

  <div class="tabs-container">
    <button class="tab-btn active" data-tab="cola">
        <i class="fas fa-list"></i> Cola de Reproducción
    </button>
    <button class="tab-btn" data-tab="yt-playlists">
        <i class="fab fa-youtube"></i> Mis Playlists
    </button>
  </div>

  <div id="tab-cola" class="tab-content active">
      <div id="playlistContainer">
        <div id="playlist"></div>
      </div>
  </div>

 <div id="tab-yt-playlists" class="tab-content">
    
    <div id="user-playlists-overview">
        <div id="user-playlists-content" class="empty-state">
            <p>Inicia sesión para ver tus playlists</p>
        </div>
    </div>

    <div id="user-playlist-details" style="display: none;">
        <div class="details-header">
            <button id="back-to-playlists-btn">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h3 id="details-playlist-title">Título Playlist</h3>
             <button id="import-current-playlist-btn" class="header-action-btn">
                <i class="fas fa-plus"></i> Añadir todo a Cola
            </button>
        </div>
        
        <div id="details-video-list-container">
             <div id="details-video-list"></div>
        </div>
    </div>

</div>
</section>
  </main>

  <footer>
    <p>Made with ❤️ by: <a href="https://www.facebook.com/edwin.jr.ch" target="_blank">Eduu</a></p>
  </footer>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="/youtube-client.js"></script>
  <script src="/app.js"></script>
  <script src="/botones.js"></script>
  <script src="/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
