<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Mix with Crossfire</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">
    <link rel="stylesheet" type="text/css" href="./efecto.css">
    <link rel="stylesheet" type="text/css" href="./botones.css">
    <link rel="icon" href="./electronic.ico">
</head>
<body class="vibe-theme">
<div id="contenedor-player">
    <div id="videoContainer" class="video-container">
        <div id="player1" class="video-player"></div>
        <div id="player2" class="video-player hidden"></div>
    </div>
    <div class="player-controls">
        <button id="botonExpandir"><i class="fas fa-expand-alt"></i></button>
        <button id="botonPlay"><i class="fas fa-play"></i></button>
        <button id="botonNext"><i class="fas fa-forward"></i></button>
    </div>
</div>	
    <div class="container">
        <aside class="sidebar">
            <div class="playlist-header">
	     <h3>Playlist</h3>
		</div>  
		   <div class="search-container">
         	<div class="playlist-url-input"> <input type="text" id="searchInput2" placeholder="Añadir Link Playlist :)"> </div>     
		   <button id="añadirUrlButton" class="add-to-playlist" style="width: 100%; margin-bottom: 10px;">>
                    <i class="fa-solid fa-plus"></i> <span class="add-text">Añadir a la playlist></span>
 		   </button>
                </div>
		 <div id="playlistContainer">
                   <div id="playlist"></div>
            </div>  
        </aside>
<main class="main-content">
        <section id="search-panel" class="vibe-panel">
	        <div class="search-container">
	         <input type="text" id="searchInput" placeholder="Search On Piped.video">
                </div>
                <div id="resultsContainer">
                    <div id="results"></div>
                </div>
            </section>
        </main>
		
        </footer>
    </div>
    <script src="./app.js"></script>
    <script src="./botones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
