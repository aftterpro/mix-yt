<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">

    <title>YT CrossMix: Mezclador de Playlists YouTube con Crossfade</title> 
    
    <meta name="description" content="Crea mezclas perfectas de tus playlists de YouTube. Disfruta de transiciones suaves con crossfade automático entre canciones. Ideal para fiestas y sesiones de música sin interrupciones.">

    <meta name="keywords" content="mix youtube, playlist mix, youtube crossfade, mezclador youtube, dj youtube, youtube party mix, transiciones youtube, reproductor playlist youtube, yt mix, youtube mixer">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="OT9HeSt-AF8YOPjndOBDMwJfSQ3uTb6NqLy2Ahd3TMw" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">
    <link rel="stylesheet" type="text/css" href="./efecto.css">
    <link rel="stylesheet" type="text/css" href="./loadingSpinner.css">
    <link rel="stylesheet" type="text/css" href="./botones.css">
    <link rel="icon" href="./electronic.ico">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "YT CrossMix",
      "url": "https://mix-yt.netlify.app", 
      "description": "Mezclador de playlists de YouTube con efecto crossfade automático para transiciones suaves.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://mix-yt.netlify.app",  
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    </head>
<body class="vibe-theme">
    <div class="main-player-container">
        <div id="contenedor-player" class="player-wrapper">
            <div id="videoContainer" class="video-container">
                <div id="player1" class="video-player"></div>
                <div id="player2" class="video-player hidden"></div>
            </div>
            <div class="player-controls">
                <button id="botonPlay" class="control-button">
                    <i class="fas fa-play"></i>
                </button>
                <button id="botonNext" class="control-button">
                    <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <div class="playlist-header">
                <h3>Playlist</h3>
                <div class="playlist-info">
                    <span class="playlist-count"></span>
                </div>
            </div>
            
            <div class="sidebar-actions-container">
                <div class="auth-buttons">
                    <button id="googleSignInButton" class="google-button hidden">
                        <i class="fab fa-google"></i> Cargar mi Biblioteca
                    </button>
                    <button id="googleSignOutButton" class="google-button hidden">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </div>
                <div class="playlist-url-input">
                    <input type="text" 
                           id="searchInput2" 
                           placeholder="Añadir Link Playlist :)"
                           aria-label="URL de la playlist">
                </div>
                <button id="añadirUrlButton" class="add-to-playlist">
                    <i class="fa-solid fa-plus"></i>
                    <span class="add-text">Añadir a la playlist</span>
                </button>
            </div>

            <div id="playlistContainer" class="playlist-wrapper">
                <div id="playlist" class="playlist-items"></div>
            </div>
        </aside>

        <main class="main-content">
            <section id="search-panel" class="vibe-panel">
                <div class="search-container">
                    <input type="text" 
                           id="searchInput" 
                           placeholder="Search On Piped.video"
                           aria-label="Buscar videos">
                </div>
                <div id="resultsContainer" class="results-wrapper">
                    <div id="results" class="search-results"></div>
                </div>
            </section>
        </main>
    </div>

    <template id="playlist-item-template">
        <div class="playlist-item" draggable="true">
            <div class="thumbnail-container">
                <img src="" alt="" class="playlist-thumbnail">
                <span class="duration"></span>
            </div>
            <div class="item-content">
                <h4 class="item-title"></h4>
                <div class="item-controls">
                    <button class="item-move">
                        <i class="fas fa-grip-vertical"></i>
                    </button>
                    <button class="item-delete">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="search-result-template">
    <div class="search-result-item">
        <div class="thumbnail-container">
            <img src="" alt="" class="result-thumbnail">
            <span class="duration"></span>
        </div>
        <div class="result-details">
            <h3 class="result-title video-title"></h3>
            <button class="add-to-playlist">
                <i class="fa-solid fa-plus"></i>
                <span class="add-text">Añadir a la playlist</span>
            </button>
        </div>
    </div>
</template>
    <div id="loadingSpinner" class="loading-spinner hidden">
        <div class="spinner"></div>
    </div>

    <div id="errorContainer" class="error-container hidden"></div>
    <div id="floatingMessageContainer"></div>
    
    <footer class="page-footer">
        <p>
            Con la tecnología de SponsorBlock. Created by 
            <a href="https://ajay.app/" target="_blank" rel="noopener noreferrer">Ajay Ramachandran</a>.
        </p>
        <p>
            Utilizamos la API de 
            <a href="https://piped.video/" target="_blank" rel="noopener noreferrer">Piped</a>.
            </p>
    </footer>
        <script src="./auth.js"></script>

    <script async defer src="https://apis.google.com/js/api.js" onload="gapiInitialize()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisInitalize()"></script>
    
    <script src="./app.js"></script>
</body>
</html>
