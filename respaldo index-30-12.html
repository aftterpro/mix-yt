<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Playlist Manager With Crossfire</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="./styles.css">
  <link rel="icon" href="./electronic.ico">
</head>
<body>
  <header>
    <h3>YT Playlist Manager With Crossfire</h3>
  </header>
  <main>
    <section id="search-panel">
      <h2>Search Videos</h2>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search On Piped.video">
      </div>
      <div id="resultsContainer">
        <div id="results"></div>
      </div>
    </section>

    <section id="player-panel">
      <h2>Players</h2>
       <div class="playlist-url-input"> <input type="text" id="searchInput2" placeholder="O Link Playlist y Presiona Enter :)"> </div>     
      <div id="videoContainer">
       <div id="player1" class="video-player"></div>
        <div id="player2" class="video-player hidden"></div>
      </div>
      <div id="controls">
        <button id="mixButton"><i class="fas fa-random"></i> Mix</button>
            <button id="searchButton">Search</button>
            </div>

      <h2>Equalizer</h2>
      <div id="equalizerControls">
        <div class="slider-container">
          <label for="band1">60Hz</label>
          <input type="range" id="band1" min="-30" max="30" value="0" class="slider">
          </div>      
      </div>
    </section>

    <section id="playlist-panel">
      <h2>Playlist</h2>
      <div id="playlistContainer">
        <div id="playlist"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ by: <a href="https://www.facebook.com/edwin.jr.ch" target="_blank">Eduu</a></p>
  </footer>
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
