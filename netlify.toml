[build]
  publish = "." 

# --- EDGE FUNCTIONS (Deno) ---
# Se mantienen solo las que son compatibles con Deno
[[edge_functions]]
  path = "/.netlify/functions/sponsorblock"
  function = "sponsorblock"

[[edge_functions]]
  path = "/.netlify/functions/publish-lyrics"
  function = "publish-lyrics"

[[edge_functions]]
  path = "/.netlify/functions/cors-proxy"
  function = "cors-proxy"

[[edge_functions]]
  path = "/api/proxy"
  function = "cors-proxy"

# --- REDIRECTS ---
[[redirects]]
  from = "/api/sponsorblock/*"
  to = "/.netlify/functions/sponsorblock"
  status = 200
  force = true

[[redirects]]
  from = "/api/lyrics/*"
  to = "/.netlify/functions/publish-lyrics"
  status = 200
  force = true
