[build]
  functions = "functions/"  # Directorio de tus funciones Netlify
  publish = "."             # Directorio a publicar (tu sitio estático)
  command = "npm run build" # Comando para construir tu sitio (si aplica)

# Regla para dirigir las llamadas /api/sponsorblock/* a la función sponsorblock
[[redirects]]
  from = "/api/sponsorblock/:splat"
  to = "/.netlify/functions/sponsorblock/:splat"
  status = 200

# Regla para redirigir /api/lyrics/* a la nueva función
[[redirects]]
  from = "/api/lyrics/:splat"
  to = "/.netlify/functions/publish-lyrics"
  status = 200

# Regla nueva para SponsorBlock (segments) que faltaba agregar según tu solicitud anterior
[[redirects]]
  from = "/api/segments/*"
  to = "/.netlify/functions/sponsorblock/api/segments/:splat"
  status = 200

# NOTA: Se eliminó la regla inválida de cors-proxy. 
# No es necesaria, la función ya es accesible en /.netlify/functions/cors-proxy/ automáticamente.
