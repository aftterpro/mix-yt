[build]
  # Si tu frontend se compila, usa el comando correspondiente, si es estático, déjalo vacío o usa "echo"
  publish = "." 

# --- EDGE FUNCTIONS (Deno) ---
# Estas tienen prioridad sobre las Functions normales y son más rápidas

[[edge_functions]]
  path = "/.netlify/functions/search"
  function = "search"

[[edge_functions]]
  path = "/.netlify/functions/sponsorblock"
  function = "sponsorblock"

[[edge_functions]]
  path = "/.netlify/functions/publish-lyrics"
  function = "publish-lyrics"

# --- REDIRECTS ---
# Redirigimos tus antiguas rutas /api/* a las nuevas Edge Functions

[[redirects]]
  from = "/api/sponsorblock/*"
  to = "/.netlify/functions/sponsorblock"
  status = 200
  force = true

[[redirects]]
  from = "/api/lyrics/*"
  to = "/.netlify/functions/publish-lyrics"
  status = 200
  force = true
